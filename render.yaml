services:
  - type: web
    name: mlbb-waf-solver
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard            # 2 GB RAM — Chromium needs headroom
    region: singapore         # closest to Moonton's APAC CDN
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: solver-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: API_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/pw
      - key: SOLVER_UA
        value: "Mozilla/5.0 (Linux; Android 12; TECNO LG7n Build/SP1A.210812.016; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/155.0.8059.43 Mobile Safari/537.36;UniWebView;mtakit"